name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Older bundled npm versions fail
      # with a misleading E404 on `npm publish` (npm/cli#9088), so upgrade first.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build GUI
        run: npm run build:gui

      - name: Test
        run: npm test

      # Publish to npm. Two supported paths, no silent skip either way:
      #   1. NPM_TOKEN secret in the repo -> token auth.
      #   2. No token -> npm Trusted Publisher (OIDC) configured on npmjs.com
      #      for this repo + release.yml. Requires no secrets and signs the
      #      package with provenance automatically.
      - name: Publish (NPM_TOKEN)
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish (trusted publishing / OIDC)
        if: env.NPM_TOKEN == ''
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
